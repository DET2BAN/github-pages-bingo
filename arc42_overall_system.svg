<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180">
  <rect width="280" height="180" fill="#FFFFFF"/>
  <rect width="280" height="5" fill="#344563"/>
  <defs>
    <marker id="ra" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0,0 7,3.5 0,7" fill="#CC0000"/></marker>
    <marker id="ga" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0,0 7,3.5 0,7" fill="#888"/></marker>
  </defs>
  <!-- Title -->
  <text x="140" y="22" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#344563">0. Overall System</text>
  <text x="140" y="35" text-anchor="middle" font-family="Arial" font-size="8" fill="#888">System Context Diagram</text>
  <!-- User (stick figure) -->
  <circle cx="34" cy="68" r="10" fill="#E8E8E8" stroke="#888" stroke-width="1.5"/>
  <line x1="34" y1="78" x2="34" y2="100" stroke="#888" stroke-width="1.5"/>
  <line x1="20" y1="88" x2="48" y2="88" stroke="#888" stroke-width="1.5"/>
  <line x1="34" y1="100" x2="22" y2="116" stroke="#888" stroke-width="1.5"/>
  <line x1="34" y1="100" x2="46" y2="116" stroke="#888" stroke-width="1.5"/>
  <text x="34" y="130" text-anchor="middle" font-family="Arial" font-size="7.5" fill="#333">End User</text>
  <!-- Arrow user to platform -->
  <line x1="58" y1="87" x2="82" y2="87" stroke="#CC0000" stroke-width="1.5" marker-end="url(#ra)"/>
  <!-- Central platform box -->
  <rect x="82" y="58" width="116" height="64" fill="#FFEEEE" stroke="#CC0000" stroke-width="2" rx="6"/>
  <text x="140" y="80" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#CC0000">Website &amp;</text>
  <text x="140" y="93" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#CC0000">eShop Platform</text>
  <text x="140" y="107" text-anchor="middle" font-family="Arial" font-size="7.5" fill="#888">(Sherpa)</text>
  <!-- Arrow to backend APIs -->
  <line x1="198" y1="78" x2="216" y2="72" stroke="#CC0000" stroke-width="1.5" marker-end="url(#ra)"/>
  <!-- Arrow to CDN -->
  <line x1="198" y1="100" x2="216" y2="106" stroke="#888" stroke-width="1" marker-end="url(#ga)"/>
  <!-- Box: Backend APIs -->
  <rect x="216" y="56" width="58" height="28" fill="#F5F5F5" stroke="#AAAAAA" stroke-width="1" rx="3"/>
  <text x="245" y="68" text-anchor="middle" font-family="Arial" font-size="7.5" font-weight="bold" fill="#333">Backend</text>
  <text x="245" y="79" text-anchor="middle" font-family="Arial" font-size="7" fill="#555">APIs</text>
  <!-- Box: CDN -->
  <rect x="216" y="90" width="58" height="28" fill="#F5F5F5" stroke="#AAAAAA" stroke-width="1" rx="3"/>
  <text x="245" y="102" text-anchor="middle" font-family="Arial" font-size="7.5" font-weight="bold" fill="#333">CDN /</text>
  <text x="245" y="113" text-anchor="middle" font-family="Arial" font-size="7" fill="#555">Cloud</text>
  <!-- Footer -->
  <line x1="20" y1="148" x2="260" y2="148" stroke="#EEEEEE" stroke-width="1"/>
  <text x="140" y="162" text-anchor="middle" font-family="Arial" font-size="8" fill="#888">arc42 | System Context View</text>
</svg>
