name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare site with ORG_PWD
        env:
          ORG_PWD: ${{ secrets.ORG_PWD }}
        run: |
          if [ -z "$ORG_PWD" ]; then
            echo "::error title=Missing ORG_PWD secret::Set ORG_PWD in Settings > Environments > github-pages > Secrets, then re-run this workflow."
            exit 1
          fi
          node -e "const fs = require('fs'); const html = fs.readFileSync('index.html', 'utf8').replace(/__ORG_PWD__/g, process.env.ORG_PWD); fs.mkdirSync('dist', { recursive: true }); fs.writeFileSync('dist/index.html', html);"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4