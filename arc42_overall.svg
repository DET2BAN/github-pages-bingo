<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180">
  <rect width="280" height="180" fill="#FFFFFF"/>
  <rect width="280" height="5" fill="#CC0000"/>
  <!-- Title -->
  <text x="140" y="22" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#CC0000">Website &amp; eShop (Sherpa)</text>
  <text x="140" y="35" text-anchor="middle" font-family="Arial" font-size="8" fill="#888">Micro-Frontend Platform</text>
  <!-- Platform container -->
  <rect x="8" y="43" width="264" height="98" fill="#FFF8F8" stroke="#CC0000" stroke-width="1.5" rx="6" stroke-dasharray="5,3"/>
  <text x="22" y="58" font-family="Arial" font-size="8" font-weight="bold" fill="#CC0000">Sherpa Platform</text>
  <!-- App boxes row -->
  <rect x="15" y="63" width="46" height="28" fill="#FFEEEE" stroke="#CC0000" stroke-width="1" rx="3"/>
  <text x="38" y="75" text-anchor="middle" font-family="Arial" font-size="7" font-weight="bold" fill="#CC0000">Product</text>
  <text x="38" y="85" text-anchor="middle" font-family="Arial" font-size="6" fill="#888">App</text>
  <rect x="65" y="63" width="46" height="28" fill="#FFEEEE" stroke="#CC0000" stroke-width="1" rx="3"/>
  <text x="88" y="75" text-anchor="middle" font-family="Arial" font-size="7" font-weight="bold" fill="#CC0000">Checkout</text>
  <text x="88" y="85" text-anchor="middle" font-family="Arial" font-size="6" fill="#888">App</text>
  <rect x="115" y="63" width="46" height="28" fill="#FFEEEE" stroke="#CC0000" stroke-width="1" rx="3"/>
  <text x="138" y="75" text-anchor="middle" font-family="Arial" font-size="7" font-weight="bold" fill="#CC0000">Marketing</text>
  <text x="138" y="85" text-anchor="middle" font-family="Arial" font-size="6" fill="#888">App</text>
  <rect x="165" y="63" width="46" height="28" fill="#FFEEEE" stroke="#CC0000" stroke-width="1" rx="3"/>
  <text x="188" y="75" text-anchor="middle" font-family="Arial" font-size="7" font-weight="bold" fill="#CC0000">MyAccount</text>
  <text x="188" y="85" text-anchor="middle" font-family="Arial" font-size="6" fill="#888">App</text>
  <rect x="215" y="63" width="50" height="28" fill="#FFEEEE" stroke="#CC0000" stroke-width="1" rx="3"/>
  <text x="240" y="75" text-anchor="middle" font-family="Arial" font-size="7" font-weight="bold" fill="#CC0000">+8 more</text>
  <text x="240" y="85" text-anchor="middle" font-family="Arial" font-size="6" fill="#888">Apps</text>
  <!-- Shared layer -->
  <rect x="15" y="97" width="250" height="20" fill="#F0F0F0" stroke="#AAAAAA" stroke-width="1" rx="3"/>
  <text x="140" y="110" text-anchor="middle" font-family="Arial" font-size="7.5" font-weight="bold" fill="#555">Shared Components &amp; Design System</text>
  <!-- Backend layer -->
  <rect x="15" y="121" width="250" height="16" fill="#E8E8E8" stroke="#AAAAAA" stroke-width="1" rx="3"/>
  <text x="140" y="132" text-anchor="middle" font-family="Arial" font-size="7" fill="#555">Backend APIs &amp; Microservices</text>
  <!-- Footer -->
  <line x1="20" y1="152" x2="260" y2="152" stroke="#EEEEEE" stroke-width="1"/>
  <text x="140" y="166" text-anchor="middle" font-family="Arial" font-size="8" fill="#888">arc42 | System Context</text>
</svg>
