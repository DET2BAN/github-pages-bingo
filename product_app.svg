<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180">
  <rect width="280" height="180" fill="#FFFFFF"/>
  <rect width="280" height="5" fill="#CC0000"/>
  <defs>
    <marker id="ra" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0,0 7,3.5 0,7" fill="#CC0000"/></marker>
  </defs>
  <text x="140" y="22" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#CC0000">01. Product App</text>
  <text x="140" y="35" text-anchor="middle" font-family="Arial" font-size="8" fill="#888">Architecture Overview</text>
  <!-- Box 1 -->
  <rect x="8" y="58" width="72" height="52" fill="#F5F5F5" stroke="#AAAAAA" stroke-width="1.5" rx="4"/>
  <text x="44" y="78" text-anchor="middle" font-family="Arial" font-size="8" font-weight="bold" fill="#333">Search &amp;</text>
  <text x="44" y="90" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">Browse</text>
  <text x="44" y="102" text-anchor="middle" font-family="Arial" font-size="7" fill="#888">User Input</text>
  <!-- Arrow 1 -->
  <line x1="80" y1="84" x2="98" y2="84" stroke="#CC0000" stroke-width="1.5" marker-end="url(#ra)"/>
  <!-- Box 2 (central) -->
  <rect x="98" y="50" width="84" height="68" fill="#FFEEEE" stroke="#CC0000" stroke-width="2" rx="4"/>
  <text x="140" y="74" text-anchor="middle" font-family="Arial" font-size="8" font-weight="bold" fill="#CC0000">Product</text>
  <text x="140" y="86" text-anchor="middle" font-family="Arial" font-size="8" font-weight="bold" fill="#CC0000">Catalog</text>
  <text x="140" y="100" text-anchor="middle" font-family="Arial" font-size="7" fill="#888">Filter · Sort · Compare</text>
  <!-- Arrow 2 -->
  <line x1="182" y1="84" x2="200" y2="84" stroke="#CC0000" stroke-width="1.5" marker-end="url(#ra)"/>
  <!-- Box 3 -->
  <rect x="200" y="58" width="72" height="52" fill="#F5F5F5" stroke="#AAAAAA" stroke-width="1.5" rx="4"/>
  <text x="236" y="78" text-anchor="middle" font-family="Arial" font-size="8" font-weight="bold" fill="#333">Product</text>
  <text x="236" y="90" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">Detail Page</text>
  <text x="236" y="102" text-anchor="middle" font-family="Arial" font-size="7" fill="#888">(PDP)</text>
  <line x1="20" y1="148" x2="260" y2="148" stroke="#EEEEEE" stroke-width="1"/>
  <text x="140" y="162" text-anchor="middle" font-family="Arial" font-size="8" fill="#888">arc42 | Building Block View</text>
</svg>
